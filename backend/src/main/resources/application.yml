server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: interntrack-ai-service
  jackson:
    time-zone: Asia/Kolkata
  datasource:
    url: jdbc:h2:mem:interntrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

interntrack:
  timezone: Asia/Kolkata
  setup:
    one-time-secret: "enterprise-setup-secret-2026"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,https://interntrack-ai-98f45.web.app,https://interntrack-ai-98f45.firebaseapp.com}
  firebase:
    config-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:interntrack-ai-98f45.firebasestorage.app}
    enabled: true
  ai:
    api-key: ${GROQ_API_KEY:}
    provider: ${AI_PROVIDER:GROQ}
    model: ${AI_MODEL:openai/gpt-oss-20b}
    url: ${LLM_API_URL:https://api.groq.com/openai/v1/chat/completions}

brevo:
  api:
    key: ${BREVO_API_KEY:}
  sender:
    email: ${BREVO_SENDER_EMAIL:yuglodha67@gmail.com}
    name: ${BREVO_SENDER_NAME:InternTrack}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

logging:
  level:
    com.interntrack: INFO
    org.springframework.security: INFO
