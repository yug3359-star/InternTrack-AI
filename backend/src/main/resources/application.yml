server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: interntrack-ai-service
  jackson:
    time-zone: UTC
  datasource:
    url: jdbc:h2:mem:interntrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

interntrack:
  timezone: UTC
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,https://interntrack-ai-98f45.web.app,https://interntrack-ai-98f45.firebaseapp.com}
  firebase:
    config-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:interntrack-ai-98f45.firebasestorage.app}
    enabled: true
  ai:
    api-key: ${GROQ_API_KEY:your_groq_api_key_here}
    provider: ${AI_PROVIDER:GROQ}
    model: ${AI_MODEL:llama-3.1-8b-instant}
    url: ${LLM_API_URL:https://api.groq.com/openai/v1/chat/completions}

aws:
  rekognition:
    access-key-id: ${AWS_ACCESS_KEY_ID:your_aws_access_key_here}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:your_aws_secret_here}
    region: ${AWS_REGION:us-east-1}
    enabled: ${AWS_REKOGNITION_ENABLED:true}

logging:
  level:
    com.interntrack: INFO
    org.springframework.security: INFO
